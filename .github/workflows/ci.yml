name: ZigModu CI/CD

on:
  push:
    branches: [master, main, develop]
    paths-ignore: ['docs/**', '*.md']
  pull_request:
    branches: [master, main]
  release:
    types: [published]
  # Manual trigger for debugging workflow-level failures (0s runs with no
  # jobs) without needing a code push.
  workflow_dispatch:
  # Nightly concurrency soak (`zig build soak`): heavy N-clients x M-tenants
  # traffic with cross-tenant-leak assertions. Too slow for every push, which
  # is exactly why it runs on a schedule.
  schedule:
    - cron: '17 3 * * *'

concurrency:
  # `event_name` is part of the key so the nightly `schedule` run — which fires on
  # refs/heads/master and therefore used to share this group — cannot cancel a
  # release's in-flight push run (and vice versa). Superseded runs of the *same*
  # event still cancel each other, which is the part that matters for pushes.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # Pin the exact toolchain used for local development so fmt/build behavior
  # is reproducible in CI. NOTE: ziglang mirrors garbage-collect old dev
  # builds — dev.1567 404'd and broke Setup Zig; when that recurs, bump to
  # the current master dev build and verify locally first.
  ZIG_VERSION: "0.17.0-dev.2151+2ec5523d5"

jobs:
  # ── Windows cross-compile (no DB drivers) ──────
  # Guards the Windows-only compile branches (ioctlsocket/WSAPoll/inode
  # intCast etc.) and the -Ddb=none driver-free path without needing the
  # Windows CI runner or system DB libraries.
  windows-cross:
    name: Windows cross-compile (-Ddb=none)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Zig
        # mlugg/setup-zig@v1 builds old-pattern URLs (zig-<os>-<arch>) that
        # 404 for current dev builds; download the tarball from ziglang.org
        # directly using the arch-first name. Old dev builds get
        # garbage-collected — bump ZIG_VERSION when this 404s again.
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) ART="zig-x86_64-linux" ;;
            macOS) ART="zig-aarch64-macos" ;;
            *) echo "unsupported runner OS: $RUNNER_OS"; exit 1 ;;
          esac
          curl -fsSL "https://ziglang.org/builds/$ART-$ZIG_VERSION.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP/zig/$ART-$ZIG_VERSION" >> "$GITHUB_PATH"
      - name: Cross-compile library (driver-free)
        run: zig build -Ddb=none -Dtarget=x86_64-windows

  # ── Build & Test Matrix ────────────────────────
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        # mlugg/setup-zig@v1 builds old-pattern URLs (zig-<os>-<arch>) that
        # 404 for current dev builds; download the tarball from ziglang.org
        # directly using the arch-first name. Old dev builds get
        # garbage-collected — bump ZIG_VERSION when this 404s again.
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) ART="zig-x86_64-linux" ;;
            macOS) ART="zig-aarch64-macos" ;;
            *) echo "unsupported runner OS: $RUNNER_OS"; exit 1 ;;
          esac
          curl -fsSL "https://ziglang.org/builds/$ART-$ZIG_VERSION.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP/zig/$ART-$ZIG_VERSION" >> "$GITHUB_PATH"

      - name: Cache Zig deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: zig-${{ runner.os }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: zig-${{ runner.os }}-

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libmariadb-dev libmariadb-dev-compat libsqlite3-dev

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libpq mariadb-connector-c sqlite3 || true

      - name: Build library
        run: zig build

      - name: Compile the nightly-only targets
        # `soak` / `soak-cluster` / `runtime-stress` only *run* on the nightly
        # `schedule` (or a manual dispatch), and `zig build test` compiles its own
        # root module — so before this step, a push run never compiled them at all
        # and a compile error in any of them stayed invisible until 03:17 UTC (or
        # forever, on a day the nightly was cancelled). That is not hypothetical:
        # `src/soak_cluster.zig` did not build on Linux for days (`no field named
        # 'd_name' in struct 'os.linux.dirent64'`, fixed in the batch-12 commit)
        # and the only thing that surfaced it was one nightly going red. This
        # compiles the three targets and runs none of them.
        #
        # Linux only, on purpose: the branch that failed is `builtin.os.tag ==
        # .linux`-gated, so it is *not analysed* on macOS — the local macOS build
        # of the same commit was green while the ubuntu nightly was red. Running
        # it on the Linux leg is what makes the gate mechanical rather than
        # hopeful, and one OS is enough for a compile gate.
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: zig build soak-compile

      - name: Run tests
        # The step's status must be the *suite's*, not `tee`'s — see the comment
        # on `scripts/ci-run-logged.sh`, which is what this step now runs.
        #
        # `timeout-minutes`: a *hanging* test used to burn the run's full 6-hour
        # default before anyone learned anything. The script writes the suite's
        # output to a file as it goes, so the artifact names the last test that
        # ran even when the step is cut off.
        # The step normally takes ~6 minutes; 25 leaves generous headroom while
        # still failing fast on a hang.
        timeout-minutes: 25
        run: |
          bash scripts/ci-run-logged.sh "$RUNNER_TEMP/test-output.log" zig build test --test-timeout 300s

      # Log download via API needs admin rights; artifacts are the reliable
      # way to inspect failures from automation.
      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.os }}
          path: ${{ runner.temp }}/test-output.log
          retention-days: 7

      - name: Check canonical API imports
        run: zig build check-api

      - name: Production hot-path gate
        run: zig build check

      - name: Docs step compiles
        # `zig build docs` is a dev step that `test`/`check` never compile, so it
        # rotted silently: by the time it was run by hand it had two independent
        # drifts (removed `std.heap.GeneralPurposeAllocator`, and a 3-arg call to
        # the now-4-arg `generateDocs`). Compiling it here costs seconds and is
        # the only thing that keeps it honest.
        run: zig build docs

      - name: Tenant-scope compile gate
        run: bash scripts/check-tenant-scope.sh

      - name: Worker-pool compile gate
        # `.mode = .pooled` on a `run`-owned worker must not build (its loop would
        # occupy a pool thread for as long as it runs). Same shape as the gate
        # above: fixtures that must fail/succeed, asserted by compiling them.
        run: bash scripts/check-pool-guard.sh

      - name: Build framework examples
        # Keep this list identical to the `Build all examples` step of the
        # `examples` job below — the two drifted once (zent-modulith was built
        # only there, so a regression in it could not fail this job) and it is
        # the coverage contract: an example missing from a list is an example
        # nobody compiles until a user does. Everything listed must build
        # offline — no sibling checkout, no live service; that is why the zent
        # demos pin zent by git tag in their build.zig.zon instead of a path.
        run: |
          set -euo pipefail
          # Absent on purpose, here and in the `examples` job:
          #   production-deploy nginx/envoy/k8s/systemd references only
          #   _shared           helper lib imported by path; its only step
          #                     (`test`) needs a sibling ../zent checkout
          #   zmsaas/frontend   SolidStart app — needs the node toolchain
          for ex in ai-ops llm-policies mcp-server web4 basic distributed event-driven runtime-workers alpha-engine http-stress-test shopdemo tenant-mgmt tenant-shop zent-modulith metaverse-creative; do
            echo "== building examples/$ex =="
            (cd "examples/$ex" && zig build)
          done
          echo "== building examples/zmsaas/backend =="
          (cd examples/zmsaas/backend && zig build)

      - name: Architecture health on the example apps (zmodu doctor)
        # Blocks on cycles / missing / self / duplicate dependencies and reports
        # cross-module file imports with file:line. Runs on the example projects
        # because the framework's own tree is not laid out as src/modules/<name>.
        run: |
          set -euo pipefail
          # Subset by construction: doctor needs a module graph, so only module-layout examples are listed.
          for app in tenant-mgmt tenant-shop shopdemo zent-modulith alpha-engine metaverse-creative; do
            echo "== doctor examples/$app =="
            ./zig-out/bin/zmodu doctor "examples/$app"
          done

      - name: Run the runtime pipeline example (workers + mailboxes + timers)
        run: (cd examples/runtime-workers && zig build run)

      - name: Smoke zent-modulith (real server, 43 assertions)
        # Compiling the zent example proves nothing about the integration: the
        # v0.41.1 adaptation shipped a mismatched free that only a request
        # triggered. This walks every demo route and fails on a panic.
        run: bash examples/zent-modulith/smoke.sh

      - name: zmodu ai CLI smoke (export-skills + openapi)
        run: |
          set -euo pipefail
          ./zig-out/bin/zmodu ai export-skills --out /tmp/skills.json
          ./zig-out/bin/zmodu ai openapi --in /tmp/skills.json --out /tmp/openapi.json
          python3 - <<'EOF'
          import json
          sk = json.load(open('/tmp/skills.json'))
          assert len(sk['skills']) > 0, 'skills catalog is empty'
          doc = json.load(open('/tmp/openapi.json'))
          assert doc['openapi'] == '3.0.3'
          assert len(doc['paths']) == len(sk['skills'])
          EOF

      - name: zmodu deadcode CLI smoke
        run: |
          set -euo pipefail
          mkdir -p /tmp/dc_fixture
          cat > /tmp/dc_fixture/main.zig <<'ZIG'
          fn unused_fn() void {}
          pub fn main() void {}
          ZIG
          set +e
          out=$(./zig-out/bin/zmodu deadcode -b /tmp/dc_fixture/main.zig)
          code=$?
          set -e
          [ "$code" -eq 1 ] || { echo "expected exit 1, got $code"; exit 1; }
          echo "$out" | grep -q "unused_fn" || { echo "missing unused_fn in output"; exit 1; }
          ./zig-out/bin/zmodu deadcode -j /tmp/dc_fixture/main.zig > /tmp/dc.json || true
          python3 -c "import json; d=json.load(open('/tmp/dc.json')); assert len(d['dead_declarations']) >= 1"

      - name: zmodu audit CLI smoke (best-practice checker)
        run: |
          set -euo pipefail
          # Subset by construction: only examples that pass the checker cleanly; the legacy one (shopdemo) is exercised through the baseline path below.
          for ex in tenant-mgmt tenant-shop basic ai-ops alpha-engine zmsaas/backend; do
            ./zig-out/bin/zmodu audit "examples/$ex" -j | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['pass'], d"
          done
          # graph renders module nodes + edges
          ./zig-out/bin/zmodu graph examples/tenant-shop | grep -q "order --> tenant"
          # diff --migration emits a Flyway file
          cp examples/shopdemo/schema.sql /tmp/mig_old.sql
          printf '\nCREATE TABLE audit_log (id INTEGER PRIMARY KEY, action TEXT NOT NULL);\n' >> /tmp/mig_old.sql
          mkdir -p /tmp/mig_out
          ./zig-out/bin/zmodu diff /tmp/mig_old.sql examples/shopdemo/schema.sql --migration drop-audit-log --dir /tmp/mig_out >/dev/null
          ls /tmp/mig_out/V*.sql >/dev/null
          # rules config disables a rule
          mkdir -p /tmp/rc_fixture/.zmodu
          printf '{"max_deps":9,"disabled":["b4"]}\n' > /tmp/rc_fixture/.zmodu/rules.json
          ./zig-out/bin/zmodu audit /tmp/rc_fixture -j | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['pass']"
          # one-shot ci gate passes on a clean example
          ./zig-out/bin/zmodu ci examples/basic | grep -q "summary: PASS"
          # legacy example must be baselinable: --update then pass
          ./zig-out/bin/zmodu audit examples/shopdemo --update >/dev/null
          ./zig-out/bin/zmodu audit examples/shopdemo -j | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['pass'] and d['baseline']['suppressed']>0"
          rm -rf examples/shopdemo/.zmodu

      - name: Dead-code baseline gate
        run: bash scripts/check-deadcode.sh

      - name: Upload test logs
        # Was `path: .zig-cache/` — a content-addressed binary directory: huge,
        # unreadable, and it burned the 10 GB artifact budget without naming the
        # test that failed. The logged-runner wrapper above already writes the
        # useful file (`test-log-${{ matrix.os }}`, uploaded at the step that
        # ran the suite); anything else here is only worth keeping when a gate
        # script left output behind.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-logs-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/*.log
            .zig-cache/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  # ── Lint & Audit ──────────────────────────────
  lint:
    name: Lint & Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        # mlugg/setup-zig@v1 builds old-pattern URLs (zig-<os>-<arch>) that
        # 404 for current dev builds; download the tarball from ziglang.org
        # directly using the arch-first name. Old dev builds get
        # garbage-collected — bump ZIG_VERSION when this 404s again.
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) ART="zig-x86_64-linux" ;;
            macOS) ART="zig-aarch64-macos" ;;
            *) echo "unsupported runner OS: $RUNNER_OS"; exit 1 ;;
          esac
          curl -fsSL "https://ziglang.org/builds/$ART-$ZIG_VERSION.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP/zig/$ART-$ZIG_VERSION" >> "$GITHUB_PATH"

      - name: Install deps
        run: sudo apt-get install -y libpq-dev libmariadb-dev libmariadb-dev-compat libsqlite3-dev

      - name: Zig fmt check
        # Single home for the formatting gate: the build graph owns the path
        # list (`fmt-check` in build.zig), so this job and any local run call
        # the same thing. It used to also run in `build-and-test`, i.e. three
        # times across the matrix for one platform-independent check.
        run: zig build fmt-check

      - name: Version consistency
        run: bash scripts/check-version.sh

  examples:
    name: Build Examples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # No sibling zent checkout: zent-modulith pins zent via git tag in its
      # build.zig.zon (v0.33.0); the old actions/checkout into ../zent both
      # violated the workspace sandbox and pinned a stale v0.12.1-era commit.

      - name: Setup Zig
        # mlugg/setup-zig@v1 builds old-pattern URLs (zig-<os>-<arch>) that
        # 404 for current dev builds; download the tarball from ziglang.org
        # directly using the arch-first name. Old dev builds get
        # garbage-collected — bump ZIG_VERSION when this 404s again.
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) ART="zig-x86_64-linux" ;;
            macOS) ART="zig-aarch64-macos" ;;
            *) echo "unsupported runner OS: $RUNNER_OS"; exit 1 ;;
          esac
          curl -fsSL "https://ziglang.org/builds/$ART-$ZIG_VERSION.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP/zig/$ART-$ZIG_VERSION" >> "$GITHUB_PATH"

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libpq-dev libmariadb-dev libmariadb-dev-compat libsqlite3-dev

      - name: Build all examples
        # Keep this list identical to the `Build framework examples` step of
        # the `build-and-test` job above (same exclusions, same order) — see
        # the comment there for why the lists exist and what may not join.
        run: |
          set -euo pipefail
          # Absent on purpose, here and in the `build-and-test` job:
          #   production-deploy nginx/envoy/k8s/systemd references only
          #   _shared           helper lib imported by path; its only step
          #                     (`test`) needs a sibling ../zent checkout
          #   zmsaas/frontend   SolidStart app — needs the node toolchain
          for ex in ai-ops llm-policies mcp-server web4 basic distributed event-driven runtime-workers alpha-engine http-stress-test shopdemo tenant-mgmt tenant-shop zent-modulith metaverse-creative; do
            echo "== building examples/$ex =="
            (cd "examples/$ex" && zig build)
          done
          echo "== building examples/zmsaas/backend =="
          (cd examples/zmsaas/backend && zig build)

      - name: Run the example test steps
        # Only the examples that ship a `test` step: this runs the same command
        # their READMEs advertise, so a broken assertion is caught here instead
        # of in a reader's clone. zent-modulith is absent on purpose — its
        # `test` step runs `smoke.sh`, which the `Smoke zent-modulith` step of
        # the `build-and-test` job above already runs once per workflow.
        run: |
          set -euo pipefail
          # Subset by construction: the examples whose build.zig ships a `test` step — examples/README.md marks the same rows.
          for ex in ai-ops basic llm-policies shopdemo tenant-mgmt web4; do
            echo "== testing examples/$ex =="
            (cd "examples/$ex" && zig build test)
          done
          echo "== testing examples/zmsaas/backend =="
          (cd examples/zmsaas/backend && zig build test)

  # ── Integration (full) ─────────────────────────
  integration-full:
    name: Integration (full)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-and-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        # mlugg/setup-zig@v1 builds old-pattern URLs (zig-<os>-<arch>) that
        # 404 for current dev builds; download the tarball from ziglang.org
        # directly using the arch-first name. Old dev builds get
        # garbage-collected — bump ZIG_VERSION when this 404s again.
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) ART="zig-x86_64-linux" ;;
            macOS) ART="zig-aarch64-macos" ;;
            *) echo "unsupported runner OS: $RUNNER_OS"; exit 1 ;;
          esac
          curl -fsSL "https://ziglang.org/builds/$ART-$ZIG_VERSION.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP/zig/$ART-$ZIG_VERSION" >> "$GITHUB_PATH"

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libpq-dev libmariadb-dev libmariadb-dev-compat libsqlite3-dev curl

      - name: Run integration probes
        # Logged through the helper rather than `| tee`: the status must be the
        # probe's, and a `tee` pipeline hangs if the command leaves an orphan
        # holding stdout (`scripts/ci-run-logged.sh`).
        run: |
          HTTP_PORT=18080 bash scripts/ci-run-logged.sh "$RUNNER_TEMP/integration.log" \
            bash scripts/ci-integration.sh

      - name: CL/TE smuggling through a real gateway (nginx)
        # Non-default ports: the probe above just used 18080.
        run: |
          APP_PORT=18180 GW_BUFFERED_PORT=18181 GW_STREAM_PORT=18182 \
            bash scripts/ci-run-logged.sh "$RUNNER_TEMP/smuggling.log" \
            bash examples/production-deploy/smuggling-e2e/run.sh

      - name: Upload smuggling log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smuggling-log
          path: ${{ runner.temp }}/smuggling.log
          retention-days: 7

      - name: Upload integration log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-log
          path: ${{ runner.temp }}/integration.log
          retention-days: 7

  # ── DB driver matrix (live postgres/mysql tests) ──
  test-postgres:
    name: Test (DB=postgres)
    runs-on: ubuntu-latest
    # A hanging test used to burn the run's 6-hour default here; the step also
    # lacked the logged-runner wrapper, so a hang produced no artifact at all.
    timeout-minutes: 30
    needs: [build-and-test]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        # mlugg/setup-zig@v1 builds old-pattern URLs (zig-<os>-<arch>) that
        # 404 for current dev builds; download the tarball from ziglang.org
        # directly using the arch-first name. Old dev builds get
        # garbage-collected — bump ZIG_VERSION when this 404s again.
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) ART="zig-x86_64-linux" ;;
            macOS) ART="zig-aarch64-macos" ;;
            *) echo "unsupported runner OS: $RUNNER_OS"; exit 1 ;;
          esac
          curl -fsSL "https://ziglang.org/builds/$ART-$ZIG_VERSION.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP/zig/$ART-$ZIG_VERSION" >> "$GITHUB_PATH"

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libpq-dev libmariadb-dev libmariadb-dev-compat libsqlite3-dev

      - name: Run postgres tests
        env:
          DB: postgres
          PGconninfo: host=localhost port=5432 dbname=postgres user=postgres password=postgres
          # Opt-in real-database coverage for the postgres dialect (the
          # DistributedLock table lock; SQLite-only runs skip it).
          # PGSSLMODE=disable: the sqlx PG driver defaults to `require`, and the
          # service container below has no TLS. Production keeps the secure
          # default; this only relaxes the throwaway test database.
          ZIGMODU_TEST_PG: "1"
          PGSSLMODE: disable
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          bash scripts/ci-run-logged.sh "$RUNNER_TEMP/pg-test.log" zig build test --test-timeout 300s

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-postgres
          path: ${{ runner.temp }}/pg-test.log
          retention-days: 7

  test-mysql:
    name: Test (DB=mysql)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-and-test]
    services:
      mysql:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: secret
          MARIADB_DATABASE: zigzero_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        # mlugg/setup-zig@v1 builds old-pattern URLs (zig-<os>-<arch>) that
        # 404 for current dev builds; download the tarball from ziglang.org
        # directly using the arch-first name. Old dev builds get
        # garbage-collected — bump ZIG_VERSION when this 404s again.
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) ART="zig-x86_64-linux" ;;
            macOS) ART="zig-aarch64-macos" ;;
            *) echo "unsupported runner OS: $RUNNER_OS"; exit 1 ;;
          esac
          curl -fsSL "https://ziglang.org/builds/$ART-$ZIG_VERSION.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP/zig/$ART-$ZIG_VERSION" >> "$GITHUB_PATH"

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libpq-dev libmariadb-dev libmariadb-dev-compat libsqlite3-dev

      - name: Run mysql tests
        env:
          DB: mysql
          MYSQL_HOST: 127.0.0.1
          MYSQL_USER: root
          MYSQL_PASSWORD: secret
          MYSQL_DATABASE: zigzero_test
        run: |
          bash scripts/ci-run-logged.sh "$RUNNER_TEMP/mysql-test.log" zig build test --test-timeout 300s

      - name: Upload mysql test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-test-log
          path: ${{ runner.temp }}/mysql-test.log
          retention-days: 7

  # Runs the env-gated live-service tests (redis client, Redis rate limiter,
  # NATS, Kafka).
  test-live-services:
    name: Test (Redis + NATS + Kafka live)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-and-test]
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      nats:
        image: nats:2
        ports:
          - 4222:4222
      kafka:
        image: apache/kafka:3.7.2
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        # mlugg/setup-zig@v1 builds old-pattern URLs (zig-<os>-<arch>) that
        # 404 for current dev builds; download the tarball from ziglang.org
        # directly using the arch-first name. Old dev builds get
        # garbage-collected — bump ZIG_VERSION when this 404s again.
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) ART="zig-x86_64-linux" ;;
            macOS) ART="zig-aarch64-macos" ;;
            *) echo "unsupported runner OS: $RUNNER_OS"; exit 1 ;;
          esac
          curl -fsSL "https://ziglang.org/builds/$ART-$ZIG_VERSION.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP/zig/$ART-$ZIG_VERSION" >> "$GITHUB_PATH"

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libpq-dev libmariadb-dev libmariadb-dev-compat libsqlite3-dev

      - name: Run live-service tests
        env:
          REDIS_URL: redis://127.0.0.1:6379
          NATS_URL: nats://127.0.0.1:4222
          KAFKA_BOOTSTRAP: 127.0.0.1:9092
        run: |
          bash scripts/ci-run-logged.sh "$RUNNER_TEMP/live-test.log" zig build test --test-timeout 300s

      - name: Upload live-service test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-test-log
          path: ${{ runner.temp }}/live-test.log
          retention-days: 7

  # ── Benchmark ──────────────────────────────────
  soak:
    name: Nightly soak (N clients x M tenants)
    runs-on: ubuntu-latest
    # Scheduled + manual only: this is the slow, high-fan-out run.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) ART="zig-x86_64-linux" ;;
            macOS) ART="zig-aarch64-macos" ;;
            *) echo "unsupported runner OS: $RUNNER_OS"; exit 1 ;;
          esac
          curl -fsSL "https://ziglang.org/builds/$ART-$ZIG_VERSION.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP/zig/$ART-$ZIG_VERSION" >> "$GITHUB_PATH"

      - name: Install deps
        run: sudo apt-get install -y libpq-dev libmariadb-dev libmariadb-dev-compat libsqlite3-dev

      - name: Soak (cross-tenant leak assertions + frozen-registry concurrency)
        # Larger than the local defaults: the point of running this nightly is
        # to widen the window, not to re-run the fast suite.
        run: zig build soak -Dsoak-clients=64 -Dsoak-iterations=200

      - name: Cluster soak (raft election/replication + event-bus invariants)
        # `soak` above covers HTTP + tenant isolation only; `soak-cluster` is the
        # one harness that exercises ClusterServer's lifecycle, the per-connection
        # handshake and in-flight AppendEntries truncation. It had never run in
        # CI at all (docs/dev/v1.0-readiness-v0.32.md B-10 tracked the gap).
        #
        # The RSS budget is stated here rather than left at the default: the
        # spread this asserts is dominated by allocator page retention (the
        # runner's own leak check stays at `0 leaked`), and it grows with traffic
        # — measured on macOS, the *unchanged* tree fails the old 64 MiB default
        # at 2x traffic (12 -> 108 MiB). 192 MiB keeps the invariant meaningful
        # (a real leak of the same magnitude as the delivered volume would still
        # trip it) without turning a Linux runner's allocator behaviour into a
        # coin flip. The growth itself is an open finding, tracked in the
        # CHANGELOG entry for this batch.
        env:
          SOAK_CLUSTER_RSS_BUDGET_MIB: "192"
        run: zig build soak-cluster

      - name: Runtime stress (supervision tree / pools / timers)
        # The runtime harness asserts the things a short single-threaded test
        # cannot: claims, ready-ring fairness, timer ownership under churn.
        run: zig build runtime-stress -Druntime-stress-duration-ms=60000

      - name: Fuzz (bounded)
        # `--fuzz` with no limit opens the webui and never exits, so the bound is
        # mandatory. It is also incompatible with `-Dtest-filter` (the filter
        # runner panics in fuzz mode by design) — this runs the whole suite.
        run: zig build test --fuzz=2000 -Ddb=all --test-timeout 300s

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        # mlugg/setup-zig@v1 builds old-pattern URLs (zig-<os>-<arch>) that
        # 404 for current dev builds; download the tarball from ziglang.org
        # directly using the arch-first name. Old dev builds get
        # garbage-collected — bump ZIG_VERSION when this 404s again.
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) ART="zig-x86_64-linux" ;;
            macOS) ART="zig-aarch64-macos" ;;
            *) echo "unsupported runner OS: $RUNNER_OS"; exit 1 ;;
          esac
          curl -fsSL "https://ziglang.org/builds/$ART-$ZIG_VERSION.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP/zig/$ART-$ZIG_VERSION" >> "$GITHUB_PATH"

      - name: Install deps
        run: sudo apt-get install -y libpq-dev libmariadb-dev libmariadb-dev-compat libsqlite3-dev

      - name: Run benchmarks
        run: zig build benchmark -Doptimize=ReleaseFast

      # History only — this action needs a `gh-pages` branch, which this repo
      # does not have, so it can neither store nor compare. It stays
      # `continue-on-error` and is NOT the gate; `scripts/check-bench.sh` below
      # is. Run after the history step on purpose: a failed step skips the rest
      # of the job, and a regression is exactly when the history data point is
      # worth having.
      #
      # To make the action authoritative instead: create the branch
      # (`git checkout --orphan gh-pages && git commit --allow-empty -m init
      # && git push -u origin gh-pages`), drop `skip-fetch-gh-pages`, then drop
      # `continue-on-error` and set `fail-on-alert: true`.
      - name: Store benchmark results
        continue-on-error: true
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'customSmallerIsBetter'
          output-file-path: bench-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '150%'
          # The repo has no gh-pages branch yet; without this the action dies
          # on `git fetch … gh-pages` (job never ran until the branch guard was
          # fixed, so this surfaced only now).
          skip-fetch-gh-pages: true

      - name: Performance gate (baseline comparison)
        # The authoritative gate: compares every metric against
        # scripts/bench-baseline.json and fails when one is more than 2.0x
        # slower (lower is better). Runs the suite in a temporary directory, so
        # it neither overwrites the `bench-results.json` the step above stored
        # nor leaves files in the working tree.
        #
        # This job stays push-to-main/master only. A benchmark run needs a full
        # ReleaseFast build plus the suite itself, and the numbers move with
        # runner load — which is a bad trade for a per-PR check, especially for
        # fork PRs, where the comparison would be between the committed baseline
        # and a different machine class. Landing on master still gets the
        # verdict, and `workflow_dispatch` runs it on demand for a PR.
        #
        # If the runner is *systematically* slower than wherever the baseline was
        # recorded, re-record it (`bash scripts/check-bench.sh --update`, then
        # review the diff) — do not raise BENCH_THRESHOLD to make it pass.
        #
        # BENCH_BASELINE: gate the runner against numbers recorded *on this
        # runner class*, not the maintainer's laptop. One absolute-time baseline
        # cannot serve both — on identical code ubuntu-latest measures ~1.3x the
        # M1 Pro it was recorded on (6.57 ms vs ~10.9 ms for CircuitBreaker x10M,
        # all 23 metrics scaling together), which left ~18% of headroom under the
        # 2.0x threshold and reddened a commit that changed only a shell script.
        #
        # BENCH_UPDATE_MISSING_OUT: alongside the verdict, write a merged
        # candidate baseline — existing CI entries verbatim, plus this run's
        # values for metrics the CI file does not know yet (e.g. a newly added
        # metric WARNs "not in the baseline" until one of these is committed).
        # The step below uploads it as an artifact on green runs; a maintainer
        # reviews the diff and commits it. Never reaches the verdict, and a red
        # run uploads nothing.
        env:
          BENCH_BASELINE: scripts/bench-baseline.ci.json
          BENCH_UPDATE_MISSING_OUT: ${{ runner.temp }}/bench-baseline.ci.updated.json
        run: bash scripts/check-bench.sh

      - name: Upload refreshed CI baseline candidate
        # Green runs only (default condition): numbers from a failed run are
        # exactly what must not become the ratchet. Download the artifact,
        # review the diff against scripts/bench-baseline.ci.json, commit —
        # this is the runner-class recording path for newly added metrics;
        # do not blanket `--update` the file (see scripts/check-bench.sh header).
        uses: actions/upload-artifact@v4
        with:
          name: bench-baseline-ci-updated
          path: ${{ runner.temp }}/bench-baseline.ci.updated.json
          retention-days: 30

  # ── Docker Build ──────────────────────────────
  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: [build-and-test, lint]
    if: github.event_name == 'release'
    # Pushing to ghcr.io needs packages:write — the default GITHUB_TOKEN is
    # read-only in this repo (first release push was denied with "installation
    # not allowed to Create organization package").
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Release ────────────────────────────────────
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'release'
    # Uploading assets to the release needs contents:write (default token is
    # read-only in this repo).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        # mlugg/setup-zig@v1 builds old-pattern URLs (zig-<os>-<arch>) that
        # 404 for current dev builds; download the tarball from ziglang.org
        # directly using the arch-first name. Old dev builds get
        # garbage-collected — bump ZIG_VERSION when this 404s again.
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) ART="zig-x86_64-linux" ;;
            macOS) ART="zig-aarch64-macos" ;;
            *) echo "unsupported runner OS: $RUNNER_OS"; exit 1 ;;
          esac
          curl -fsSL "https://ziglang.org/builds/$ART-$ZIG_VERSION.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP/zig/$ART-$ZIG_VERSION" >> "$GITHUB_PATH"

      - name: Install deps
        run: sudo apt-get install -y libpq-dev libmariadb-dev libmariadb-dev-compat libsqlite3-dev

      - name: Verify tag matches build.zig.zon
        env:
          REF_TAG: ${{ github.ref_name }}
        run: bash scripts/check-release.sh

      - name: Build release
        run: zig build -Doptimize=ReleaseSafe

      - name: Package artifacts
        run: |
          mkdir -p release
          cp -r zig-out/bin release/
          # no zig-out/lib: `zig build` only installs bin/
          cp README.md CHANGELOG.md LICENSE release/ 2>/dev/null || true
          tar -czf zigmodu-${{ github.ref_name }}-linux-x86_64.tar.gz -C release .

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: zigmodu-${{ github.ref_name }}-linux-x86_64.tar.gz

  # ── AI real-provider smoke (optional; runs only when LLM_API_KEY is set) ──
  ai-real-provider:
    name: AI real-provider smoke
    runs-on: ubuntu-latest
    # secrets/env are NOT available in a job-level `if` (GitHub rejects the
    # whole workflow with "Unrecognized named-value: 'env'"). Gate per-step
    # instead: env context is populated by the time steps evaluate.
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ env.LLM_API_KEY != '' }}
      - name: Setup Zig
        if: ${{ env.LLM_API_KEY != '' }}
        # mlugg/setup-zig@v1 builds old-pattern URLs (zig-<os>-<arch>) that
        # 404 for current dev builds; download the tarball from ziglang.org
        # directly using the arch-first name. Old dev builds get
        # garbage-collected — bump ZIG_VERSION when this 404s again.
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) ART="zig-x86_64-linux" ;;
            macOS) ART="zig-aarch64-macos" ;;
            *) echo "unsupported runner OS: $RUNNER_OS"; exit 1 ;;
          esac
          curl -fsSL "https://ziglang.org/builds/$ART-$ZIG_VERSION.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP/zig/$ART-$ZIG_VERSION" >> "$GITHUB_PATH"
      - name: Install deps
        if: ${{ env.LLM_API_KEY != '' }}
        run: sudo apt-get install -y libsqlite3-dev
      - name: Build llm-policies example
        if: ${{ env.LLM_API_KEY != '' }}
        run: (cd examples/llm-policies && zig build)
      - name: Run real-provider policy smoke
        if: ${{ env.LLM_API_KEY != '' }}
        run: (cd examples/llm-policies && ./zig-out/bin/llm-policies)
        env:
          LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
