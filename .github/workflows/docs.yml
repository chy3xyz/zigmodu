name: docs

# The site builds straight from the repository's own `docs/`, so a documentation
# edit is an ordinary commit — there is no separate tree to keep in sync and no
# sync step that can silently fall behind. That is the whole reason this lives
# in-tree rather than in a standalone site repository.
#
# Builder: `zdoc` (https://github.com/chy3xyz/zdoc) in documentation mode — one
# pinned static binary, no Node, no npm lockfile, no site config. `zdoc docs`
# derives the sidebar from the directory tree, emits per-page TOCs, search index
# and mermaid support itself, and reports links it cannot resolve as warnings
# while still generating the site. The warnings for links that climb out of
# `docs/` (`../../CHANGELOG.md`, `../../src/…`) are by design: those documents
# are written to be read in the repository, and both this workflow and the
# VitePress build it replaced treat them as exempt rather than dead.
on:
  push:
    # This repository's default branch is `master`, not `main` — ci.yml lists
    # both because it runs across forks, but a Pages trigger names one branch.
    branches: [master]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Pinned zdoc release; bump together with the SHA256 line below (the
  # upstream SHA256SUMS asset is the source of truth for the hash).
  ZDOC_VERSION: v0.16.1
  ZDOC_SHA256: 17aaf2e38e9c49a2b719c9fddc1385c610abdd14be5e9653fa751af86d82e7f1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zdoc (${{ env.ZDOC_VERSION }})
        run: |
          curl -sSfL -o zdoc.tar.xz \
            "https://github.com/chy3xyz/zdoc/releases/download/${ZDOC_VERSION}/x86_64-linux-musl.tar.xz"
          echo "${ZDOC_SHA256}  zdoc.tar.xz" | sha256sum -c -
          tar -xJf zdoc.tar.xz
          ./zdoc version

      - name: Build documentation site
        run: |
          ./zdoc docs docs \
            --title ZigModu \
            --url-prefix zigmodu \
            --output site-dist

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
