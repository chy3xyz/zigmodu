name: 文档读数与实现不符
about: 发现文档里的数字/结论与代码实际不符——这是本项目最独特、也最高价值的贡献
title: "[文档] "
labels: documentation
assignees: ''
body: |
  ## 为什么这类 issue 对本项目特别重要

  这个仓库的门禁能防住**死代码**、防住**未运行的测试**、防住**未分配的契约**，
  但**防不住"文档里的数字落后于代码"**——第 154 批之前，
  死代码基线写 28（实为 32）、test artifact 写 6（实为 8）、
  runtime gauge 写 25（实为 31），全靠人工核对发现。

  **所以这类报告是有先例的、被接受的，而且不要求你理解 18 万行代码。**

  ## 哪类问题算这个

  - 文档/注释里写"共 N 条""基线是 N""跑了 N 个测试"，与实际不符
  - 链接指向不存在的文件，或指向已删除的函数/字段
  - README 声称的能力在代码里找不到
  - 两份文档对同一件事的说法冲突
    （例：`AGENTS.md` 与 `docs/PRODUCTION_ROADMAP.md` 对"阶段 9"的口径不一致）

  ## 请给出证据

  **不要只说"文档好像错了"。请给出你实际跑出来的数**：

  ```bash
  # 例子：把某条文档声称的计数实测一遍
  find src -name '*.zig' | xargs cat | wc -l
  grep -rhoE '"zigmodu_runtime_[a-z_]+"' src/ | sort -u | wc -l
  python3 -c "import json;print(len(json.load(open('scripts/deadcode-baseline.json'))['items']))"

  # 你的实际命令写在这里
  ```

  | 项 | 值 |
  |---|---|
  | 位置 | <!-- 文档路径:行号 --> |
  | 文档写的 | <!-- 原文照抄这一句 --> |
  | 实际是 | <!-- 你实测的数--> |
  | 你用的命令 | <!-- 让别人能复现，不是只有你能跑出来 --> |

  ## 特别注意

  - **历史记录不要改**：`CHANGELOG.md` 的旧条目与带日期的审计快照
    （如 `docs/dev/v1.0-readiness-v0.35.md`）记录的是**当时**的事实。
    改它们反而破坏"当时这么写"的史料。**只报当前口径的文档**。
  - **不确定是不是漂移**：先开 issue 问，别直接 PR。这不丢人——第 156 批就有一个
    下游项目的仓库地址需要维护者自己确认才没写错。

  ---

  <!-- 顺带一提：如果你是第一次给这个项目提 PR，见 `CONTRIBUTING.md` 与
       `GOVERNANCE.md` §三 —— 文档纠正和小修复不需要任何人批准。 -->
