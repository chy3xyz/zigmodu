name: 可证伪的缺陷报告
about: 带上复现命令——本项目的所有断言都是"读数 + 命令输出"形式
title: "[缺陷] "
labels: bug
assignees: ''
body: |
  ## 这个模板为什么这样设计

  本项目的一切证据都是**读数 + 可复现命令**（`docs/dev/reproducing-evidence.md`）。
  门禁判"死代码"靠的是基线 diff，判"分配契约"靠的是会失败的分配器。
  **所以缺陷报告的门槛不是"我相信你"，而是"我能自己跑一遍"。**

  ## 复现命令（最重要）

  请给出**一条我能直接执行**的命令或步骤。

  ```bash
  # 例子：往 runtime 热路径里加一次分配，契约测试应该变红
  # 你的实际复现写在这里
  ```

  **怎么确认你的复现有效**：把它插进树里跑一次，应该**红**。
  如果它本来就是绿的，那说明你发现的可能不是缺陷，或者复现没生效——
  **这种情况下也请开issue并说明**，这本身是有价值的信息。

  ## 期望行为 vs 实际行为

  <!--两行都要。 -->

  ## 影响面

  <!-- 勾选相关项，这决定优先级 -->

  - [ ] 认证 / 授权 / 租户隔离
  - [ ] 密码学 / 随机数
  - [ ] 集群 / 复制 / 一致性
  - [ ] 内存 / 分配 / 生命周期（use-after-free、越界）
  - [ ] 解码路径（HTTP / WS / H2 / 帧解析）
  - [ ] 性能回归（分配或延迟）
  - [ ] 文档与代码不一致
  - [ ] 构建 / 工具链 / 门禁本身

