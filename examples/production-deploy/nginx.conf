# nginx — TLS termination + h2c reverse proxy for ZigModu.
#
# Copy into /etc/nginx/conf.d/zigmodu.conf (or mount in docker compose).
# Certs: replace with real ones (certbot / your CA).

upstream zigmodu_backend {
    # Backend speaks h2c (Server.enable_http2) on plain HTTP.
    server app1:8080 max_conns=4096;
    server app2:8080 max_conns=4096;
    keepalive 64;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Do not let a slow client hold a connection forever (pairs with the
    # backend's own header_timeout_ms / max_connections).
    client_header_timeout 10s;
    client_body_timeout   30s;
    send_timeout          30s;
    client_max_body_size  8m;      # == Server.Config.max_body_size

    # In-flight request budget per backend instance.
    limit_conn_zone $server_name zone=per_server:10m;
    limit_conn per_server 4096;

    location / {
        proxy_pass http://zigmodu_backend;
        proxy_http_version 1.1;    # switch to 2 for h2c upstreams if enabled
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Keep the gateway from hanging longer than the app's request budget.
        proxy_connect_timeout 3s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # WebSocket / SSE: let the app decide when to end the stream.
        proxy_buffering off;
    }

    # Liveness: cheap, no dependency checks — a failure here restarts nothing
    # by itself, it only tells the LB the instance is gone.
    location = /health/live {
        proxy_pass http://zigmodu_backend;
        access_log off;
    }

    # Readiness: gate traffic on this. If dependencies are down, the instance
    # is removed from rotation instead of restart-looped.
    location = /health/ready {
        proxy_pass http://zigmodu_backend;
        access_log off;
    }

    # Metrics: never expose to the public internet.
    location = /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny all;
        proxy_pass http://zigmodu_backend;
        access_log off;
    }
}

# Plain HTTP → redirect to TLS, except health checks from the LB.
server {
    listen 8080;
    location = /health/live  { proxy_pass http://zigmodu_backend; access_log off; }
    location = /health/ready { proxy_pass http://zigmodu_backend; access_log off; }
    location / { return 301 https://$host$request_uri; }
}
