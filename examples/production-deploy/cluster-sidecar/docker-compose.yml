# Three Raft/Bus cluster nodes, each wrapped by an nginx mTLS sidecar.
#
#   node ──loopback plaintext+HMAC── sidecar ═══ mTLS over the wire ═══ sidecar ──loopback── node
#
# The framework binds its cluster ports on 0.0.0.0 (no bind-host knob yet),
# so the sidecar also installs iptables rules making the plaintext ports
# (9501 raft / 9502 bus) loopback-only inside the shared network namespace.
# The only ports reachable from the docker network are the sidecars' mTLS
# listeners (9601/9602). See README.md.
#
# Peers are literal IPs because the framework's peer grammar is id@host:port
# with host parsed as an IP (no DNS) — hence the static IPAM below.

name: zigmodu-cluster-sidecar

networks:
  clusternet:
    name: zigmodu_cluster_sidecar_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

x-sidecar-common: &sidecar-common
  build:
    context: .
    dockerfile: Dockerfile.sidecar
  image: zigmodu-cluster-sidecar:local
  cap_add:
    - NET_ADMIN # iptables plaintext lockdown (sidecar-entrypoint.sh)
  volumes:
    - ./certs:/certs:ro
  restart: "no"

x-node-common: &node-common
  build:
    # cluster-node compiles against the framework as `.path`, so the build
    # context is the repository root (same convention as ../Dockerfile).
    context: ../../..
    dockerfile: examples/production-deploy/cluster-sidecar/Dockerfile.node
  image: zigmodu-cluster-node:local
  env_file: ./certs/cluster.env # generated by ./gen-certs.sh
  restart: "no"
  entrypoint: ["/bin/sh", "-c"]

services:
  sidecar1:
    <<: *sidecar-common
    networks:
      clusternet:
        ipv4_address: 172.28.0.11
    environment:
      NODE_NAME: node1
      PEERS: "2:172.28.0.12,3:172.28.0.13"

  node1:
    <<: *node-common
    network_mode: service:sidecar1
    depends_on:
      - sidecar1
    command:
      - >-
        exec /app/bin/cluster-node --id n1 --raft-port 9501 --bus-port 9502
        --peer-raft n2@127.0.0.1:19702 --peer-raft n3@127.0.0.1:19703
        --peer-bus n2@127.0.0.1:19802 --peer-bus n3@127.0.0.1:19803
        --secret-hex "$$CLUSTER_SECRET" --bus-key-hex "$$BUS_KEY"
        --own-key-hex "$$KEY_N1"
        --peer-key-hex "n2:$$KEY_N2" --peer-key-hex "n3:$$KEY_N3"

  sidecar2:
    <<: *sidecar-common
    networks:
      clusternet:
        ipv4_address: 172.28.0.12
    environment:
      NODE_NAME: node2
      PEERS: "1:172.28.0.11,3:172.28.0.13"

  node2:
    <<: *node-common
    network_mode: service:sidecar2
    depends_on:
      - sidecar2
    command:
      - >-
        exec /app/bin/cluster-node --id n2 --raft-port 9501 --bus-port 9502
        --peer-raft n1@127.0.0.1:19701 --peer-raft n3@127.0.0.1:19703
        --peer-bus n1@127.0.0.1:19801 --peer-bus n3@127.0.0.1:19803
        --secret-hex "$$CLUSTER_SECRET" --bus-key-hex "$$BUS_KEY"
        --own-key-hex "$$KEY_N2"
        --peer-key-hex "n1:$$KEY_N1" --peer-key-hex "n3:$$KEY_N3"

  sidecar3:
    <<: *sidecar-common
    networks:
      clusternet:
        ipv4_address: 172.28.0.13
    environment:
      NODE_NAME: node3
      PEERS: "1:172.28.0.11,2:172.28.0.12"

  node3:
    <<: *node-common
    network_mode: service:sidecar3
    depends_on:
      - sidecar3
    command:
      - >-
        exec /app/bin/cluster-node --id n3 --raft-port 9501 --bus-port 9502
        --peer-raft n1@127.0.0.1:19701 --peer-raft n2@127.0.0.1:19702
        --peer-bus n1@127.0.0.1:19801 --peer-bus n2@127.0.0.1:19802
        --secret-hex "$$CLUSTER_SECRET" --bus-key-hex "$$BUS_KEY"
        --own-key-hex "$$KEY_N3" --peer-key-hex "n1:$$KEY_N1" --peer-key-hex "n2:$$KEY_N2"
