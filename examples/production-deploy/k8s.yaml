# ZigModu on Kubernetes: probes, restart policy, resource caps, metrics scrape.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zigmodu-api
spec:
  replicas: 3
  selector:
    matchLabels: { app: zigmodu-api }
  template:
    metadata:
      labels: { app: zigmodu-api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      # TLS is terminated at the Ingress/LB; the pod speaks plain HTTP.
      containers:
        - name: api
          image: registry.example.com/zigmodu-api:0.15.36
          ports: [{ containerPort: 8080 }]
          env:
            - { name: HTTP_PORT, value: "8080" }
            - { name: HTTP_MAX_CONNECTIONS, value: "4096" }
            - { name: HTTP_HEADER_TIMEOUT_MS, value: "10000" }
            - { name: WS_WRITE_TIMEOUT_MS, value: "10000" }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: zigmodu-secrets, key: jwt-secret } }
          # Liveness: process-level only. Never check dependencies here, or a
          # downstream outage turns into a cluster-wide restart storm.
          livenessProbe:
            httpGet: { path: /health/live, port: 8080 }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Readiness: dependency-aware. Failed readiness removes the pod from
          # Service endpoints without restarting it.
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            requests: { cpu: "100m", memory: "64Mi" }
            limits: { cpu: "2", memory: "512Mi" }
          # Graceful drain: Server.withGracefulDrain waits for in-flight requests.
          lifecycle:
            preStop:
              exec: { command: ["sh", "-c", "sleep 5"] }
---
apiVersion: v1
kind: Service
metadata:
  name: zigmodu-api
spec:
  selector: { app: zigmodu-api }
  ports: [{ port: 80, targetPort: 8080 }]
---
# Scale on saturation, not on CPU alone if you have a request-rate metric.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zigmodu-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: zigmodu-api }
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
